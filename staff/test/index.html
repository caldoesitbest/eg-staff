<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code of Conduct test · Staff Hub · Envious Gluttony™</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05071f">
<link rel="icon" type="image/png" href="/assets/home/favicon-64.png">
<link rel="stylesheet" href="/assets/fonts.css?v=5">
<link rel="stylesheet" href="/assets/staff.css?v=1">
</head>
<body class="hub-page test-page">
<canvas class="hub-stars" id="hub-stars" aria-hidden="true"></canvas>

<header class="hub-top">
  <a class="brand" href="/staff/"><img class="brand-mark" src="/assets/home/eg-mark.webp" alt="" width="44" height="33"><span class="brand-name">Staff Hub</span></a>
  <p class="hub-word">Code of Conduct <span>test</span></p>
  <div class="test-clock" id="test-clock" hidden><span class="i-wrap" aria-hidden="true"><i data-icon="timer"></i></span><span id="test-time" class="tab" role="timer" aria-live="off">00:00</span></div>
</header>

<main class="test-main" id="test-main" tabindex="-1" aria-live="polite">
  <div class="gate-card"><span class="loader" aria-hidden="true"></span><p>Getting your test ready…</p></div>
</main>

<div class="test-watermark" id="test-watermark" aria-hidden="true" hidden></div>
<div class="print-block" aria-hidden="true">Printing is turned off during the test.</div>

<dialog class="confirm" id="confirm" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <div class="confirm-body" id="confirm-body"></div>
    <div class="confirm-acts">
      <button class="btn btn-ghost" value="no" id="confirm-no">Keep going</button>
      <button class="btn btn-primary" value="yes" id="confirm-yes">Submit</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="/assets/icons.js?v=7"></script>
<script src="/assets/config.js?v=7"></script>
<script src="/assets/supa.js?v=6"></script>
<script src="/assets/staff-test.js?v=1"></script>
</body>
</html>
