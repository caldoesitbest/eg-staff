<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>EG Staff Applications</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2304050f'/%3E%3Cpath d='M12 3c.4 5 2.4 7.3 9 9-6.6 1.7-8.6 4-9 9-.4-5-2.4-7.3-9-9 6.6-1.7 8.6-4 9-9z' fill='%2338e8ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Rajdhani:wght@600;700&display=swap">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand-slot" id="brand-slot"><a class="brand" href="/"><i data-icon="crown"></i><span>Envious Gluttony™</span></a></div>
    <span class="spaced" style="color: var(--muted)">Admin</span>
  </header>

  <section class="login-card glow-card" id="gate" aria-live="polite">
    <p class="count-note">Checking your access…</p>
  </section>

  <main id="dash" hidden>
    <div class="admin-head">
      <h1>Staff applications</h1>
      <div class="admin-actions">
        <button class="btn btn-ghost btn-sm" id="export" type="button"><i data-icon="download"></i>Export CSV</button>
        <button class="btn btn-ghost btn-sm" id="refresh" type="button"><i data-icon="refresh-cw"></i>Refresh</button>
      </div>
    </div>
    <div class="stats" id="stats" role="group" aria-label="Filter by status"></div>
    <div class="admin-grid" id="grid">
      <div class="list-col">
        <div class="toolbar">
          <label class="search"><i data-icon="search"></i><input class="inp" id="search" type="search" placeholder="Search name, username or ID" aria-label="Search applications"></label>
        </div>
        <p class="count-note" id="count-note"></p>
        <ul class="app-list" id="list"></ul>
      </div>
      <section class="detail glow-card" id="detail" aria-label="Application"></section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../assets/icons.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/supa.js"></script>
<script src="../assets/nav.js"></script>
<script src="../assets/authui.js"></script>
<script src="../assets/admin.js"></script>
</body>
</html>
