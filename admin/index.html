<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>EG Staff Applications</title>
<link rel="icon" type="image/png" href="../assets/home/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/home/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/fonts.css?v=5">
<link rel="stylesheet" href="../assets/style.css?v=5">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand-slot" id="brand-slot" data-mark="/assets/home/eg-mark.webp"><a class="brand" href="/"><img class="brand-mark" src="/assets/home/eg-mark.webp" alt="" width="44" height="33"><span>Envious Gluttony™</span></a></div>
    <span class="spaced" style="color: var(--muted)">Admin</span>
  </header>

  <section class="login-card glow-card" id="gate" aria-live="polite">
    <p class="count-note">Checking your access…</p>
  </section>

  <main id="dash" hidden>
    <div class="admin-head">
      <h1>Staff applications</h1>
      <div class="admin-actions">
        <button class="btn btn-ghost btn-sm" id="export" type="button"><i data-icon="download"></i>Export CSV</button>
        <button class="btn btn-ghost btn-sm" id="refresh" type="button"><i data-icon="refresh-cw"></i>Refresh</button>
      </div>
    </div>
    <div class="stats" id="stats" role="group" aria-label="Filter by status"></div>
    <div class="admin-grid" id="grid">
      <div class="list-col">
        <div class="toolbar">
          <label class="search"><i data-icon="search"></i><input class="inp" id="search" type="search" placeholder="Search name, username or ID" aria-label="Search applications"></label>
        </div>
        <p class="count-note" id="count-note"></p>
        <ul class="app-list" id="list"></ul>
      </div>
      <section class="detail glow-card" id="detail" aria-label="Application"></section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../assets/icons.js?v=5"></script>
<script src="../assets/config.js?v=5"></script>
<script src="../assets/supa.js?v=5"></script>
<script src="../assets/nav.js?v=5"></script>
<script src="../assets/authui.js?v=5"></script>
<script src="../assets/admin.js?v=5"></script>
</body>
</html>
